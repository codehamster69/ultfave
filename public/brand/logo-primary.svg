<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 100" width="628" height="100" fill="none" role="img" aria-labelledby="ultfavePrimaryTitle">
  <title id="ultfavePrimaryTitle">Ultfave lockup: folded U mark and wordmark</title>
  <!-- Primary lockup. Mark is fixed coral; wordmark inherits currentColor, so set
       color:#F7EDE3 on dark surfaces and color:#150A12 on light surfaces.
       Mark height 84 against a 100 cap height; gap 24. -->
  <path fill="#FF5236" d="M0 0H24V60H54V0H60L78 18V84H0Z" transform="translate(0 16)"/>
  <g fill="currentColor">
    <path d="M0 0H20V80H58V0H78V100H0Z" transform="translate(102 0)"/>
    <path d="M0 0H20V80H58V100H0Z" transform="translate(188 0)"/>
    <path d="M0 0H70V20H45V100H25V20H0Z" transform="translate(254 0)"/>
    <path d="M0 0H58V20H20V43H52V63H20V100H0Z" transform="translate(332 0)"/>
    <path fill-rule="evenodd" d="M24 0H56L80 100H59L51 70H29L21 100H0ZM40 20L47 52H33Z" transform="translate(398 0)"/>
    <path d="M0 0H21L38 80L55 0H76L47 100H29Z" transform="translate(486 0)"/>
    <path d="M0 0H58V20H20V42H52V62H20V80H58V100H0Z" transform="translate(570 0)"/>
  </g>
</svg>
